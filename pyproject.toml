[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "agrosuite"
version = "1.0.0"
description = "Dados de monitores agrícolas: importação, limpeza, análise DIFM e prescrição"
readme = "README.md"
requires-python = ">=3.10"
license = { text = "MIT" }

dependencies = [
    "numpy>=1.26",
    "pandas>=2.1",
    "scipy>=1.11",
    "geopandas>=1.0",
    "shapely>=2.0",
    "pyproj>=3.6",
    "pyogrio>=0.9",
    "fastapi>=0.110",
    "uvicorn[standard]>=0.29",
    "python-multipart>=0.0.9",
    "jinja2>=3.1",
    "openpyxl>=3.1",
]

[project.scripts]
agrosuite = "agrosuite.cli:main"

[tool.setuptools.packages.find]
include = ["agrosuite*"]

[tool.setuptools.package-data]
agrosuite = ["app/static/*", "app/static/vendor/*"]
